services:
  mysql:
    image: mysql:8.4
    container_name: smartsplit-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartsplit}
      MYSQL_USER: ${MYSQL_USER:-smartsplit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartsplit_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "3306:3306"
    volumes:
      - smartsplit_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: smartsplit-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smartsplit}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${MYSQL_USER:-smartsplit}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartsplit_dev}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-at-least-32-characters-before-production}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      OCR_STORAGE_DIRECTORY: /app/uploads/receipts
      TESSERACT_EXECUTABLE: ${TESSERACT_EXECUTABLE:-tesseract}
      TESSERACT_DATA_PATH: ${TESSERACT_DATA_PATH:-}
      TESSERACT_LANGUAGE: ${TESSERACT_LANGUAGE:-vie+eng}
    ports:
      - "8081:8080"
    volumes:
      - smartsplit_receipt_data:/app/uploads/receipts
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: smartsplit-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  smartsplit_mysql_data:
  smartsplit_receipt_data:
